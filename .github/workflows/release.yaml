name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  windows-installer:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows MSI installers with go-msi
        run: bash scripts/build-windows-msi.sh "$GITHUB_REF_NAME"

      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: release-packages/windows/*.msi
          if-no-files-found: error
          retention-days: 1

  macos-dmg:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS DMG with MyGo
        run: bash scripts/build-mygo-packages.sh macos "$GITHUB_REF_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: release-packages/macos/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - windows-installer
      - macos-dmg
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Write RPM signing key
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$RPM_SIGNING_KEY"
          umask 077
          printf '%s\n' "$RPM_SIGNING_KEY" > "$RUNNER_TEMP/rpm-signing-key.asc"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installers
          path: release-packages/windows

      - name: Download macOS DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: release-packages/macos

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Generate macOS and Linux GUI icons
        run: go run ./scripts/generate-platform-icons.go

      - name: Embed Windows executable icons
        run: bash scripts/generate-windows-icons.sh

      - name: Generate third-party credits
        run: bash scripts/generate-credits.sh

      - name: Stage Windows icon resources for Go builds
        run: bash scripts/windows-icon-resources.sh stage

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_PATH: ${{ runner.temp }}/rpm-signing-key.asc
          NFPM_PASSPHRASE: ${{ secrets.NFPM_PASSPHRASE }}

      - name: Remove staged Windows icon resources
        if: always()
        run: bash scripts/windows-icon-resources.sh clean
