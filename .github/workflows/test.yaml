name: test

on:
  push:
    # Feature branches are tested through pull_request to avoid duplicate runs.
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'AGENTS.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CODE_SIGNING_POLICY.md'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    # synchronize reruns CI when commits are pushed to an existing PR.
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.gitignore'
      - 'AGENTS.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CODE_SIGNING_POLICY.md'
      - 'LICENSE'
      - 'README.md'

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install OpenSSH server for integration coverage
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Run tests
        run: go test ./...

      - name: Generate credits if missing
        shell: bash
        run: |
          if [ ! -s CREDITS ] || [ ! -s internal/credits/dependencies.txt ]; then
            bash scripts/generate-credits.sh
          fi

      - name: Run GUI build-tag tests
        run: go test -tags gui ./cmd/ssh-keyselect-gui ./internal/selector
