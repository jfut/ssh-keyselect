name: test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install OpenSSH server for integration coverage
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Run tests
        run: go test ./...

      - name: Generate credits if missing
        shell: bash
        run: |
          if [ ! -s CREDITS ] || [ ! -s internal/credits/dependencies.txt ]; then
            bash scripts/generate-credits.sh
          fi

      - name: Run GUI build-tag tests
        run: go test -tags gui ./cmd/ssh-keyselect-gui ./internal/selector
